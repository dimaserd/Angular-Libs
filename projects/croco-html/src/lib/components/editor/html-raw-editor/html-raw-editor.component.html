@if (presentOrEdit) {
    <div [innerHTML]="safeHtml">
    </div>
}
@else {
  <div>
    <div style="height: 10px;">
    </div>
    <div>
      <mat-form-field class="w-100">
        <mat-label>
          Внутренняя разметка тега
        </mat-label>
        <textarea matInput cdkTextareaAutosize #autosize="cdkTextareaAutosize"
          cdkAutosizeMinRows="1"
          placeholder="Внутренняя разметка тега"
          [(ngModel)]="_tag.innerHtml"
          (ngModelChange)="onHtmlChanged()"
        ></textarea>
      </mat-form-field>
    </div>
  </div>
}
